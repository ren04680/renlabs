<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MIT ADT · Rehan</title>
<style>
:root{--bg:#0f1113;--fg:#eceae6;--muted:#8b8780;--mic:#2563eb;--live:#2fbf71;--speak:#60a5fa;--btn:#22252a;--red:#e5484d}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:max(24px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(24px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));
  -webkit-tap-highlight-color:transparent;user-select:none}
header{padding-top:12px;text-align:center}
h1{margin:0;font-size:1.5rem;font-weight:600;letter-spacing:.01em}
.stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px}
.micwrap{position:relative;width:180px;height:180px;display:grid;place-items:center}
#ring{position:absolute;inset:0;border-radius:50%;background:var(--mic);opacity:.18;transition:transform .08s linear,background .3s}
#mic{position:relative;width:132px;height:132px;border-radius:50%;border:0;background:var(--mic);color:#ffffff;
  display:grid;place-items:center;cursor:pointer;box-shadow:0 10px 40px rgba(0,0,0,.45);transition:background .3s,transform .15s}
#mic:active{transform:scale(.96)}
#mic:disabled{cursor:default}
#mic svg{width:52px;height:52px}
#status{color:var(--muted);font-size:1rem;min-height:1.4em;text-align:center}
body[data-state=connecting] #ring{animation:spin 1.2s linear infinite;opacity:.35}
body[data-state=listening] #mic,body[data-state=listening] #ring{background:var(--live)}
body[data-state=speaking] #mic,body[data-state=speaking] #ring{background:var(--speak)}
@keyframes spin{0%{transform:scale(1);opacity:.35}50%{transform:scale(1.18);opacity:.12}100%{transform:scale(1);opacity:.35}}
.controls{display:flex;gap:44px;padding-bottom:8px}
.ctl{display:flex;flex-direction:column;align-items:center;gap:8px;color:var(--muted);font-size:.8rem}
.ctl button{width:64px;height:64px;border-radius:50%;border:0;display:grid;place-items:center;cursor:pointer;
  background:var(--btn);color:var(--fg);transition:background .2s,opacity .2s}
.ctl button svg{width:26px;height:26px}
.ctl button:disabled{opacity:.35;cursor:default}
#mute.on{background:var(--fg);color:var(--bg)}
#hang{background:var(--red);color:#fff}
button:focus-visible{outline:3px solid var(--fg);outline-offset:3px}
.foot{position:fixed;bottom:max(8px,env(safe-area-inset-bottom));font-size:.68rem;color:#55524d}
@media (prefers-reduced-motion:reduce){#ring{transition:none}body[data-state=connecting] #ring{animation:none}}
</style>
</head>
<body data-state="idle">
<header><h1>Welcome to MIT ADT</h1></header>
<div class="stage">
  <div class="micwrap">
    <div id="ring"></div>
    <button id="mic" type="button" aria-label="Start call">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10a7 7 0 0 0 14 0"/><path d="M12 17v4"/></svg>
    </button>
  </div>
  <div id="status">Tap the mic to talk</div>
</div>

<div class="controls">
  <div class="ctl">
    <button id="mute" type="button" aria-pressed="false" aria-label="Mute" disabled>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 2l20 20"/><path d="M9 9v3a3 3 0 0 0 5.1 2.1"/><path d="M15 9.3V5a3 3 0 0 0-5.7-1.3"/><path d="M19 10a7 7 0 0 1-1 3.6M5 10a7 7 0 0 0 10.4 6.1"/><path d="M12 17v4"/></svg>
    </button>
    <span id="mutelabel">Mute</span>
  </div>
  <div class="ctl">
    <button id="hang" type="button" aria-label="Hang up" disabled>
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 9c-1.6 0-3.15.25-4.6.72v3.1c0 .39-.23.74-.56.9-.98.49-1.87 1.12-2.66 1.85a.99.99 0 0 1-1.41-.01L.29 13.08a1 1 0 0 1 0-1.41C3.34 8.78 7.46 7 12 7s8.66 1.78 11.71 4.67a1 1 0 0 1 0 1.41l-2.48 2.48a.99.99 0 0 1-1.41.01 11.3 11.3 0 0 0-2.66-1.85 1 1 0 0 1-.56-.9v-3.1C15.15 9.25 13.6 9 12 9z"/></svg>
    </button>
    <span>Hang up</span>
  </div>
</div>
<div class="foot">Renlabs demo</div>
<script src="/app.js"></script>
</body>
</html>
